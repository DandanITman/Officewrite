version: 2

# Keep security fixes, but disable routine version-update pull requests.
# Security updates are enabled separately in repository settings.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Upgrade Electron majors deliberately because they change the runtime.
      - dependency-name: electron
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
